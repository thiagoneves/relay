name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # LTO and strip only run in the release profile, which is what ships.
      - run: cargo build --locked --release
      # The npm launcher downloads the release named after its own version.
      - name: npm launcher version matches Cargo.toml
        shell: bash
        run: test "$(node -p "require('./npm/package.json').version")" = "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
      - run: npm test
        working-directory: npm
