[package]
name = "relay"
version = "0.1.0"
edition = "2024"
# let-chains (`if let … && let …`) are stable from 1.88.
rust-version = "1.88"
description = "Context layer for coding agents: compresses what goes in, remembers what matters, lives in your repo."
license = "MIT"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Building text with `push_str(&format!(..))` reads better than
# `write!` + a discarded fmt::Result in handoff and brief builders.
format_push_string = "allow"
# Token and byte counts shown to humans; precision loss is irrelevant.
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
